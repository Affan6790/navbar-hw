<!DOCTYPE html>
<html>
    <head>
        <title> NavBar</title>
        <style>
            body{
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
            }
            .topnav{
                overflow: hidden;
                background-color: seashell;
            }
            .topnav a{
                float: left;
                color: blue;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px;
            }
            .topnav a:hover{
                background-color: skyblue;
                color: black;
            }
            .topnav a.active{
                background-color: lightseagreen;
                color: black;
            }
        </style>
    </head>
    <body>
        <div class="topnav">
            <a class="active" href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Gallery</a>
            <a href="#">Contact Us</a>
            <a href="#">Mail us</a>
            <a href="#">Offers</a>
            <a href="#">Sevices</a>
            <a href="#">Job Application</a>
        </div>
    </body>
</html>
